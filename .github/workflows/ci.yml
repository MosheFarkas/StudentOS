name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # Integration tests run against a real Postgres. Everything worth testing
      # in them IS database behaviour -- foreign keys, unique constraints, and
      # queries scoped by user id -- so a mock would happily pass a cross-user
      # access test that the real database would too.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: contexto
          POSTGRES_PASSWORD: contexto
          POSTGRES_DB: contexto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://contexto:contexto@localhost:5432/contexto_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `-w` is required: pnpm 11 treats a bare `pnpm <script>` at the workspace
      # root as recursive, which fails on packages that don't define the script.
      #
      # Ordered cheapest-first so a formatting slip fails in seconds rather than
      # after a full build.
      - name: Format
        run: pnpm -w run format:check

      - name: Lint
        run: pnpm -w run lint

      - name: Typecheck
        run: pnpm -w run typecheck

      - name: Test
        run: pnpm -w run test

      - name: Build
        run: pnpm -w run build
