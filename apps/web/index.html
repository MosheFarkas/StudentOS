<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContextoAgent</title>
    <meta name="description" content="An AI agent that knows your coursework." />
    <meta name="theme-color" content="#0a1045" />

    <!--
      Separate files per size rather than one large icon for the browser to
      downscale. A 512 squeezed into a 16px tab loses the thin white outline
      inside the mark and turns to mush; a file rendered at 16 keeps it.

      apple-touch-icon is deliberately opaque: iOS composites transparency
      onto BLACK, so an alpha icon shows as a dark tile on the home screen.
    -->
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      The interface's own face, fetched before the CSS that asks for it. Every
      screen is set in this, so waiting for the stylesheet to be parsed first
      is a visible swap from the system sans on every cold load. The serif is
      not preloaded: it appears in one place, below the fold of a fresh
      conversation, and can afford to arrive with the reply it sets.
    -->
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
